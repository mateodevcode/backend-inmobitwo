name: Deploy Backend

on:
    push:
        branches: [main]

jobs:
    deploy:
        runs-on: ubuntu-latest
        timeout-minutes: 45

        steps:
            - name: SSH Deploy
              uses: appleboy/ssh-action@v1
              with:
                  host: ${{ secrets.SERVER_IP }}
                  username: root
                  key: ${{ secrets.SSH_KEY }}
                  command_timeout: 40m
                  script: |
                      set -e  # ← detiene el script si cualquier comando falla

                      echo "🚀 Iniciando despliegue..."

                      cd /var/www/inmobitwo/backend-inmobitwo

                      echo "→ Descartando cambios locales no versionados..."
                      git reset --hard HEAD
                      git clean -fd

                      echo "→ Actualizando código..."
                      git fetch origin main
                      git reset --hard origin/main

                      echo "→ Reconstruyendo y levantando contenedor..."
                      docker compose up -d --build

                      echo "→ Limpiando imágenes viejas sin uso..."
                      docker image prune -f

                      echo "→ Verificando que el contenedor esté corriendo..."
                      sleep 5
                      docker compose ps | grep "Up" || (echo "❌ El contenedor no está corriendo" && exit 1)

                      echo "→ Estado final:"
                      docker compose ps

                      echo "✅ Despliegue completado!"
