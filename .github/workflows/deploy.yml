name: Deploy Backend to VPS

on:
    push:
        branches:
            - main

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Deploy via SSH
              uses: appleboy/ssh-action@v1
              with:
                  host: ${{ secrets.SERVER_IP }}
                  username: root
                  key: ${{ secrets.SSH_KEY }}
                  script: |
                      echo "🚀 Iniciando despliegue del Backend..."

                      cd /var/www/inmobitwo/backend-inmobitwo

                      git pull origin main || { echo "❌ Error en git pull"; exit 1; }

                      npm install --production

                      # Reiniciar con PM2
                      pm2 restart inmobitwo-api --update-env || echo "⚠️ PM2 process reiniciado o creado"

                      echo "✅ Backend desplegado correctamente!"
                      pm2 list
