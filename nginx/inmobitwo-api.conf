# === nginx: inmobitwo-api — api.inmobitwo.seventwo.tech (proxy total al backend) ===
# Backend Node en contenedor: 127.0.0.1:3001 (sin lista de prefijos: /auth, /propiedades,
# /usuarios, /organizaciones, /favoritos, /tracking, /leads, /api, /catalogos, /ia, ...)
# Certificado independiente: /etc/letsencrypt/live/api.inmobitwo.seventwo.tech/

# --- HTTP → HTTPS ---
server {
    listen 80;
    listen [::]:80;
    server_name api.inmobitwo.seventwo.tech;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.inmobitwo.seventwo.tech;

    ssl_certificate /etc/letsencrypt/live/api.inmobitwo.seventwo.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.inmobitwo.seventwo.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Fotos a S3 vía multer: margen para subidas
    client_max_body_size 25M;
    gzip on;
    gzip_types application/json;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
